# Linux build: runs the core test suite on a real Linux runner, then
# builds the full app (.deb + AppImage). CI has no access to the release
# GK shares, so these artifacts address a CI-local room universe — the
# release-channel Linux build happens on a secrets-holding machine.
name: linux
on:
  push:
    branches: [app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (Tauri Linux prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Core test suite on Linux
        run: |
          set -o pipefail
          if ! cargo test -p onlyhumans_core 2>&1 | tee /tmp/test.log; then
            grep -E 'FAILED|panicked at|^error|error\[|test result' /tmp/test.log | head -40 \
              | sed 's/^/::error::/'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the app (deb + AppImage)
        run: npx tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onlyhumans-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
