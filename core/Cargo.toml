[package]
name = "onlyhumans_core"
version = "1.1.1"
edition = "2024"

[build-dependencies]
hex = "0.4.3"
rand = "0.8"
sha2 = "0.11.0"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.92"
chacha20poly1305 = "0.11.0"
futures = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
libp2p = { version = "0.57.0", features = ["tokio", "quic", "tcp", "dns", "noise", "yamux", "identify", "relay", "dcutr", "macros", "ping", "request-response", "ed25519"] }
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
