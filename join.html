<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Join a room — OnlyHumans</title>
<meta name="description" content="Every word is a key. Type a name and a shared word — end-to-end sealed, no account.">
<meta name="theme-color" content="#0e1518">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://onlyhumans.deepflux.space/join">
<meta property="og:title" content="OnlyHumans — Every Word is a Key">
<meta property="og:description" content="Type your own word and only your people can find you. Sealed end-to-end — no accounts, no servers reading your words.">
<meta property="og:image" content="https://onlyhumans.deepflux.space/logo.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" as="script" href="/join-assets/portal-GXQUOAVS.js">
<style>
  /* Design system adopted from the desktop app (src/app.css) so the
     portal and the app read as one product. */
  :root {
    /* surfaces */
    --bg: #0e1518;
    --panel: #14202a;
    --panel-2: #0f1a21;
    --line: #1f3038;
    /* accents — frozen meanings: teal brand/public · violet private ·
       green live · amber code/waiting · red destructive */
    --teal: #17a2b8;
    --teal-dim: #0d6e79;
    --violet: #8b5cf6;
    --violet-dim: #251b47;
    --violet-line: #3b2d6b;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #c0564f;
    /* text */
    --text: #d8e4e8;
    --muted: #8fa6b0;
    --danger: #c0564f;
    /* type scale (12px floor) · radius */
    --fs-xs: 12px; --fs-s: 13px; --fs-m: 14px; --fs-l: 16px;
    --r-card: 8px; --r-pill: 999px; --r-input: 6px;
  }

  :focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* Fixed shell instead of height:100dvh — fills exactly the visible area
     on phones, and iOS can't scroll the whole app out from under the user
     when the composer takes focus. All scrolling lives inside (#app's
     children own their overflow). */
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: var(--fs-m);
    overflow: hidden;
  }

  /* command bar */
  header.cmdbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid #1f3038;
  }
  header.cmdbar .brandlogo { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; }
  header.cmdbar .logo { font-weight: 700; letter-spacing: .04em; color: var(--teal); white-space: nowrap; }
  .roomchip {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--text); font-size: var(--fs-s); padding: 5px 9px;
    border: 1px solid var(--line); border-radius: var(--r-card);
    background: var(--panel-2); cursor: default; user-select: none; white-space: nowrap;
  }
  .roomchip .rs-glyph { color: var(--teal); }
  .roomchip .rs-label { font-weight: 600; }
  .idmenu {
    display: inline-flex; align-items: center; gap: 7px;
    background: transparent; border: 1px solid transparent; border-radius: var(--r-card);
    color: var(--text); font-size: var(--fs-s); padding: 5px 9px; cursor: pointer;
  }
  .idmenu:hover { background: var(--panel-2); }
  .idmenu .avatar { width: 20px; height: 20px; font-size: 10px; }
  .idmenu .idname { color: var(--muted); }
  .idmenu .caret { color: var(--muted); font-size: 10px; }
  /* profile sheet's own button — deliberately bordered/brighter than the
     ghost idmenu so it reads as an action, not part of the name chip.
     Owns the bar's right-push: the room shows no site-wide facts, so the
     first right-cluster element carries it. */
  .profilebtn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: auto;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-card);
    color: var(--text); font-size: var(--fs-s); padding: 5px 10px; cursor: pointer;
    white-space: nowrap;
  }
  .profilebtn:hover { color: var(--teal); border-color: var(--teal-dim); background: var(--teal-dim); }

  .menu {
    position: fixed; z-index: 90; min-width: 240px; max-width: 320px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-card);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .45); padding: 4px;
  }
  .menu-header {
    padding: 7px 10px 5px; color: var(--muted); font-size: var(--fs-xs);
    border-bottom: 1px solid var(--line); margin-bottom: 4px;
  }
  .menu-item {
    display: flex; flex-direction: row; align-items: center; gap: 9px;
    width: 100%; text-align: left; background: transparent; border: 0;
    color: var(--text); font-size: var(--fs-m); padding: 7px 10px; border-radius: var(--r-input);
    cursor: pointer;
  }
  .menu-item:hover { background: var(--panel-2); }
  .menu-item .mi-text { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; }
  .menu-item .mi-hint { color: var(--muted); font-size: var(--fs-xs); }
  .menu-item .mi-icon { flex-shrink: 0; display: inline-flex; }
  .menu-item .mi-icon .avatar { width: 26px; height: 26px; font-size: 10px; }

  /* sidebar */
  main { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .sidebar {
    width: 230px; background: var(--panel-2);
    border-right: 1px solid #1f3038; display: flex; flex-direction: column;
    overflow: hidden; min-height: 0; flex-shrink: 0;
  }
  .side-label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
                color: var(--muted); padding: 14px 14px 4px; font-weight: 600; }

  /* avatars — profile photos fill the circle, initials otherwise */
  .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; user-select: none;
            position: relative; overflow: hidden; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%;
                object-fit: cover; }
  .avatar.roomavatar { background: var(--teal-dim); color: #bff3fa; }
  .avatar.roomavatar svg { width: 18px; height: 18px; }

  .member-list { list-style: none; flex: 1; min-height: 0; overflow-y: auto; }
  .member-list li {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px; margin: 1px 6px;
    border-radius: 8px; border: 1px solid transparent;
  }
  .member-list li:hover { background: #17262f; }
  .member-list li.ishost .avatar { outline: 2px solid var(--teal); outline-offset: 1px; }
  .member-list .li-body { flex: 1; min-width: 0; }
  .member-list .mname { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .member-list .li-sub { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* direct messages — labelled teal pill on member rows (visible at a
     glance, not a mystery glyph), switchable dm rows */
  .member-list li .dm-btn {
    flex-shrink: 0; height: 26px; padding: 0 10px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; border: 1px solid var(--teal-dim); background: transparent;
    color: var(--teal); font-size: 12px; font-weight: 500; line-height: 1; cursor: pointer;
  }
  .member-list li .dm-btn:hover { color: #eafcff; border-color: var(--teal); background: var(--teal-dim); }
  .member-list.dm-list { flex: 0 1 auto; }
  li.dmrow { cursor: pointer; }
  li.dmrow.active { background: #17262f; box-shadow: inset 2px 0 0 var(--teal); }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }
  .pp-pill { font-size: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--teal-dim);
             color: var(--teal); font-weight: 500; margin-left: 8px; white-space: nowrap; }
  .roomchip { cursor: pointer; }
  .roomchip:hover { border-color: var(--teal-dim); }
  .roomchip .caret { color: var(--muted); font-size: 10px; }

  /* member-row bios replace "via site" when a peer set one */
  .member-list .li-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* profile sheet (session-only profile + room picture editor) */
  .sheetwrap { position: absolute; inset: 0; background: rgba(3, 8, 10, .62);
               z-index: 30; display: flex; overflow-y: auto; }
  .sheet { margin: auto; width: min(92vw, 340px); background: var(--panel);
           border: 1px solid var(--line); border-radius: 12px; padding: 16px;
           display: flex; flex-direction: column; gap: 8px; }
  .sheet-title { font-size: 13px; font-weight: 700; color: #fff; margin-top: 4px; }
  .sheet .pf-label { font-size: 11px; color: var(--muted); }
  .sheet textarea { resize: none; line-height: 1.4; }
  .pf-photo { display: flex; align-items: center; gap: 12px; }
  .pf-photo .avatar { width: 52px; height: 52px; }
  .pf-photo-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pf-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .pf-note { font-size: 10px; color: var(--muted); }

  /* chat */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .chat .titlebar {
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid #1f3038; display: flex; gap: 12px; align-items: center;
  }
  .tb-body { flex: 1; min-width: 0; }
  .tb-title { font-weight: 700; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 8px; }
  .tb-sub { color: var(--muted); font-size: var(--fs-xs); margin-top: 2px; }
  .tb-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: flex-start; }
  .tb-actions .btn-ghost {
    border: 1px solid var(--teal-dim); background: transparent; color: var(--teal);
    font-size: var(--fs-s); font-weight: 600; padding: 6px 12px; border-radius: var(--r-input);
  }
  .tb-actions .btn-ghost:hover { background: var(--teal-dim); color: #eafcff; }
  /* Mobile home of the member list (the sidebar is folded away on
     phones): desktop keeps it hidden to avoid duplicating the sidebar. */
  .members-btn { display: none; }
  .messages { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
  .sender { font-size: var(--fs-xs); font-weight: 600; margin: 6px 0 -3px 4px; align-self: flex-start; }
  .msg.out + .sender, .msg.in + .sender { margin-top: 8px; }
  .msg { max-width: 70%; padding: 7px 11px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.out { align-self: flex-end; background: var(--teal-dim); color: #eafcff; }
  .msg.in { align-self: flex-start; background: #1d313c; }
  .msg .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .viasite { color: var(--teal); cursor: help; }
  .narration {
    text-align: center; color: var(--muted); font-size: var(--fs-xs);
    padding: 6px 0; user-select: none;
  }
  .linklike {
    background: none; border: none; padding: 0; color: var(--teal);
    text-decoration: underline; cursor: pointer; font: inherit;
  }
  .chat-hint { margin: auto; padding: 1rem; color: var(--muted); font-size: 12px;
               font-style: italic; text-align: center; }
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: .5rem; color: var(--muted); text-align: center; padding: 1rem; }
  /* Connection log: what this tab has tried lately (shown while it holds
     no seat) — attempts, seat requests, site verdicts, newest last. */
  .connlog { display: flex; flex-direction: column; gap: 3px; width: 100%; max-width: 440px;
             font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             font-size: 11px; color: var(--muted); text-align: left; }
  .cl-row { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .cl-row .cl-ts { color: #56707c; flex-shrink: 0; }
  .cl-row.ok { color: #7fd8a4; }
  .cl-row.warn { color: var(--amber); }
  .connhint { color: var(--muted); font-size: 12px; max-width: 42ch; }
  .join-progress { display: flex; align-items: center; justify-content: center; gap: .5rem;
                   margin-bottom: .6rem; color: var(--teal); }
  .spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--teal-dim);
          border-top-color: var(--teal); display: inline-block;
          animation: ohspin 1s linear infinite; }
  @keyframes ohspin { to { transform: rotate(360deg); } }
  .composer { display: flex; gap: 8px; padding: 10px; background: var(--panel); border-top: 1px solid #1f3038; align-items: flex-end; }
  .composer textarea {
    flex: 1; resize: none; min-height: 35px; max-height: 132px;
    line-height: 1.4; overflow-y: auto;
  }
  .composer button { flex-shrink: 0; }

  /* shared images — re-encoded to ≤30 KB on the sender's device
     (docs/image-sharing-study.md inline tier). Files ride the same
     30 KB tier as raw bytes, rendered as download-only chips. */
  .msg.hasimg { max-width: min(85%, 340px); padding: 4px; }
  .msg.hasimg .meta { padding: 2px 6px 3px; }
  .msgimg { display: block; max-width: 100%; max-height: 240px; border-radius: 8px;
            cursor: zoom-in; margin-top: 4px; }
  .msg.hasimg:not(.out) .msgimg, .msg.out .msgimg { background: #1d313c; }
  .msgfile { display: flex; align-items: center; gap: 9px; width: 100%; margin-top: 4px;
             padding: 8px 10px; background: #1d313c; border: 1px solid var(--line);
             border-radius: 8px; text-align: left; }
  .msgfile:hover { border-color: var(--teal); background: #1d313c; }
  .mf-icon { flex-shrink: 0; display: inline-flex; color: var(--teal); }
  .mf-icon svg { width: 18px; height: 18px; }
  .mf-body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .mf-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mf-meta { font-size: 11px; color: var(--muted); }
  .imgqueue { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
              background: var(--panel); border-top: 1px solid #1f3038; }
  .imgqueue .spin { flex-shrink: 0; }
  .iq-thumb { width: 42px; height: 42px; object-fit: cover; border-radius: 7px;
              border: 1px solid var(--line); flex-shrink: 0; }
  .iq-ficon { width: 42px; height: 42px; display: inline-flex; align-items: center;
              justify-content: center; border: 1px solid var(--line); border-radius: 7px;
              color: var(--teal); flex-shrink: 0; }
  .iq-ficon svg { width: 18px; height: 18px; }
  .iq-meta { flex: 1; font-size: 11px; color: var(--muted); min-width: 0;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .iq-x { width: 26px; height: 26px; padding: 0; display: inline-flex; align-items: center;
          justify-content: center; color: var(--muted); border-radius: 7px; flex-shrink: 0; }
  .iq-x:hover { color: var(--amber); }
  .composer .attach { width: 35px; height: 35px; padding: 0; display: inline-flex;
                      align-items: center; justify-content: center; color: var(--muted); }
  .composer .attach svg { width: 17px; height: 17px; }
  .composer .attach:hover { color: var(--teal); }
  .messages.dropglow { outline: 2px dashed var(--teal-dim); outline-offset: -6px; }

  /* reactions + emoji picker (docs/emoji-study.md) */
  .msg { position: relative; }
  /* long-press react vs iOS text selection: bubbles give up selection on
     touch only — desktop text stays selectable (copy included) */
  @media (hover: none) {
    .msg, .msg * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  }
  .reactbtn { position: absolute; top: -9px; right: -4px; display: none; width: 24px; height: 24px;
              border-radius: 50%; background: var(--panel); border: 1px solid #24404b; color: var(--muted);
              font-size: 13px; line-height: 1; cursor: pointer; align-items: center; justify-content: center;
              padding: 0; z-index: 2; }
  .msg:hover .reactbtn { display: inline-flex; }
  .reactbtn:hover { color: var(--teal); border-color: var(--teal); background: var(--panel); }
  .reactions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .reactions .react { display: inline-flex; align-items: center; gap: 5px; background: rgba(125,175,190,.09);
                      border: 1px solid transparent; border-radius: 999px; padding: 2px 8px 2px 6px;
                      font-size: 14px; line-height: 1.35; cursor: pointer; color: inherit; }
  .reactions .react:hover { border-color: #2a4a56; }
  .reactions .react.mine { border-color: var(--teal-dim); background: rgba(56,197,218,.14); }
  .reactions .react .re-n { font-size: 11px; color: var(--muted); }
  .msg.hasimg .reactions { padding: 2px 4px 4px; }
  .emojipop { position: fixed; z-index: 70; background: var(--panel); border: 1px solid #1f3038; border-radius: 12px;
              padding: 6px; width: 304px; max-width: calc(100vw - 16px); max-height: 264px; overflow-y: auto;
              box-shadow: 0 10px 34px rgba(0,0,0,.55); }
  .emojipop .eg-cat { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
                      margin: 8px 6px 2px; }
  .emojipop .eg-row { display: flex; flex-wrap: wrap; gap: 1px; }
  .emojipop .eg { background: none; border: none; color: inherit; font-size: 19px; line-height: 1.15;
                  padding: 4px 5px; border-radius: 8px; cursor: pointer; }
  .emojipop .eg:hover { background: var(--panel-2); }
  .emojipop .eg.big { font-size: 23px; }

  input, button, textarea {
    background: #1a2a33; color: var(--text); border: 1px solid #24373f;
    border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none;
    font-family: inherit;
  }
  input:focus, textarea:focus { border-color: var(--teal); }
  button { cursor: pointer; }
  button:hover { background: #213542; }
  button.primary { background: var(--teal-dim); border-color: var(--teal-dim); color: #eafcff; }
  button.primary:hover { background: var(--teal); }

  /* absolute, not fixed: anchored inside the fitted #app shell so an
     open iOS keyboard can't hide a toast behind itself */
  .toasts { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
  .toast {
    background: var(--panel); border: 1px solid var(--teal-dim);
    border-radius: 8px; padding: 10px 12px; max-width: 340px;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }

  /* gate — the inner wrapper is centered by margin:auto, so on short
     viewports the content scrolls from the top instead of being clipped
     by justify-content:center overflow */
  .gate { flex: 1; display: flex; overflow-y: auto; padding: 2rem; }
  .gate-inner { margin: auto; display: flex; flex-direction: column; align-items: center;
                gap: .7rem; text-align: center; }
  .gate .gate-logo { width: 192px; height: 192px; border-radius: 44px;
                     box-shadow: 0 12px 56px rgba(23,162,184,.25); }
  .gate h2 { color: #fff; font-size: 1.5rem; }
  .gate p { color: var(--muted); }
  .gate .gaterow { display: flex; gap: .6rem; margin-top: .6rem; width: 240px; max-width: 100%; }
  .gate input { width: 100%; min-width: 0; }
  .gaterow input { flex: 1; }
  .gaterow button { flex-shrink: 0; }
  .gaterem { display: flex; gap: .5rem; align-items: center; margin-top: .7rem;
             width: 240px; max-width: 100%; font-size: 11px; color: var(--muted);
             text-align: left; cursor: pointer; }
  .gaterem input { width: auto; flex-shrink: 0; accent-color: var(--teal); }
  .gatehint { color: var(--danger); font-size: .85rem; margin-top: .4rem; }
  .gatebuild { color: #56707c; font-size: 10px; letter-spacing: .06em; margin-top: .8rem; user-select: none; }

  /* phones: keep the single-column chat, fold the chrome away, and keep
     every field ≥16px — iOS zooms the page on focus otherwise, which
     pushes the conversation out of the visible area */
  @media (max-width: 720px) {
    header.cmdbar { padding: 8px 10px; gap: 8px; }
    header.cmdbar .logo { display: none; }
    .roomchip .rs-label { display: none; }
    .idmenu .idname, .idmenu .caret { display: none; }
    /* the Edit-profile label stays on phones: the bar has room (logo,
       roomchip label and name all collapse) and a bare ✎ isn't visible
       enough — the whole point of the button */
    .sidebar { display: none; }
    .members-btn { display: inline-flex; }
    .connlog { max-width: 100%; }
    .msg { max-width: 85%; }
    .gate { padding: 1.25rem; }
    .gate .gate-logo { width: 144px; height: 144px; border-radius: 33px; }
    .gate h2 { font-size: 1.25rem; }
    .chat .titlebar { padding: 8px 10px; gap: 10px; }
    .tb-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-actions .btn-ghost { padding: 6px 9px; }
    .messages { padding: 10px 12px; }
    .chat-hint { max-width: 36ch; }
    .composer { padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
    .composer textarea { min-height: 40px; }
    .composer button { padding: 9px 14px; }
    input, textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="/join-assets/portal-GXQUOAVS.js" defer></script>
</body>
</html>
