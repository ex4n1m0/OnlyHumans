[package]
name = "onlyhumans-app"
version = "1.0.9"
edition = "2021"

[lib]
name = "onlyhumans_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
onlyhumans_core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.45", features = ["Win32_UI_Shell", "Win32_System_Registry", "Win32_Foundation", "Win32_Security"] }


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
